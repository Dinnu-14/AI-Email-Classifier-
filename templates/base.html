<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Email Classifier | NLP & Machine Learning{% endblock %}</title>
    <meta name="description" content="Intelligent email classification using Natural Language Processing and Multinomial Naive Bayes for student mini-project.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom Application CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-2" id="mainNavbar">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="{{ url_for('index') }}">
                <span class="brand-icon d-inline-flex align-items-center justify-content-center">
                    <i class="bi bi-envelope-check-fill text-primary"></i>
                </span>
                <span>AI Email Classifier</span>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill ms-1 fs-xs">Student ML Project</span>
            </a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center gap-1">
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if active_page == 'home' %}active fw-semibold text-white bg-primary bg-opacity-25 rounded-pill{% endif %}" href="{{ url_for('index') }}">
                            <i class="bi bi-speedometer2 me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if active_page == 'dataset' %}active fw-semibold text-white bg-primary bg-opacity-25 rounded-pill{% endif %}" href="{{ url_for('dataset_view') }}">
                            <i class="bi bi-database me-1"></i> Dataset Overview
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if active_page == 'performance' %}active fw-semibold text-white bg-primary bg-opacity-25 rounded-pill{% endif %}" href="{{ url_for('performance_view') }}">
                            <i class="bi bi-graph-up me-1"></i> Model Performance
                        </a>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2 rounded-pill d-inline-flex align-items-center gap-1">
                            <span class="status-indicator bg-success"></span> Model Ready
                        </span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow-1 py-4">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer bg-white border-top py-3 mt-auto">
        <div class="container text-center text-muted small">
            <div class="row align-items-center">
                <div class="col-md-6 text-md-start mb-2 mb-md-0">
                    <span class="fw-semibold text-dark">AI Email Classifier</span> &bull; BTech AI & Data Science Mini Project
                </div>
                <div class="col-md-6 text-md-end">
                    <span>NLP &bull; TF-IDF &bull; Multinomial Naive Bayes &bull; Flask & Python</span>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <!-- Custom Application JS -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
